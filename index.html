<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5.0, user-scalable=yes" />
    <meta name="apple-mobile-web-app-capable" content="true" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#1a0f0a" />
    <meta name="format-detection" content="telephone=no" />
    
    <!-- SEO: Title & Description -->
    <title>ShareVibe - Kafe Paylaşım Platformu | QR Kod ile Fotoğraf Paylaş</title>
    <meta
      name="description"
      content="Kafe deneyimini fotoğraflarla paylaşın. QR kod ile güvenli fotoğraf paylaşımı, kampanya akışı ve kafe sahipleri için marka kontrolü."
    />
    
    <!-- SEO: Canonical Tag -->
    <link rel="canonical" href="https://sharevibe.co/" />
    
    <!-- SEO: Robots Meta Tag -->
    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />
    
    <!-- SEO: Author & Copyright -->
    <meta name="author" content="ShareVibe Ekibi" />
    <meta name="copyright" content="© 2026 ShareVibe. Tüm hakları saklıdır." />
    
    <!-- SEO: Language Alternates -->
    <link rel="alternate" hrefLang="tr-TR" href="https://sharevibe.co/" />
    <link rel="alternate" hrefLang="x-default" href="https://sharevibe.co/" />
    
    <!-- SEO: Open Graph Tags -->
    <meta property="og:site_name" content="ShareVibe" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="ShareVibe - Kafe Paylaşım Platformu" />
    <meta property="og:description" content="Kafe deneyimini fotoğraflarla paylaş. QR kod ile güvenli paylaşım platformu." />
    <meta property="og:url" content="https://sharevibe.co/" />
    <meta property="og:image" content="https://sharevibe.co/sharevibe-logo.png" />
    <meta property="og:image:alt" content="ShareVibe - Kafe Paylaşım Platformu" />
    <meta property="og:locale" content="tr_TR" />
    
    <!-- SEO: Twitter Card Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ShareVibe - Kafe Paylaşım Platformu" />
    <meta name="twitter:description" content="Kafe deneyimini fotoğraflarla paylaş. QR kod ile güvenli paylaşım." />
    <meta name="twitter:image" content="https://sharevibe.co/sharevibe-logo.png" />
    <meta name="twitter:image:alt" content="ShareVibe Platform" />
    
    <!-- SEO: Apple Touch Icons & Favicons -->
    <link rel="apple-touch-icon" href="/sharevibe-icon.png" />
    <link rel="icon" type="image/png" href="/sharevibe-icon.png" />
    
    <!-- SEO: PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />
    
    <!-- SEO: Preconnect to external resources -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
